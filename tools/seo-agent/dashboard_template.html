<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casino SEO Guardrail Agent</title>
  <style>
    :root { color-scheme: dark; --bg:#111318; --panel:#1a1d24; --panel2:#20242d; --text:#f4efe5; --muted:#b9ad9b; --gold:#d8b33f; --green:#42d383; --orange:#f5a742; --red:#ff6868; --line:#34313a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    main { width:min(1180px, calc(100% - 32px)); margin:0 auto; padding:32px 0 56px; }
    header { margin-bottom:24px; }
    h1 { margin:0 0 8px; font-size:clamp(28px, 4vw, 48px); }
    h2 { margin:0 0 14px; font-size:20px; }
    h3 { margin:0 0 8px; font-size:16px; color:var(--gold); }
    p { margin:0 0 10px; color:var(--muted); }
    a { color:var(--gold); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .grid { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; }
    .card { background:linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:0 14px 40px rgba(0,0,0,.18); }
    .span-12 { grid-column:span 12; } .span-8 { grid-column:span 8; } .span-6 { grid-column:span 6; } .span-4 { grid-column:span 4; }
    .status { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; font-weight:700; border:1px solid var(--line); }
    .status.safe { color:var(--green); } .status.warning { color:var(--orange); } .status.stop { color:var(--red); } .status.unknown { color:var(--muted); }
    .metrics { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:10px; }
    .metric { background:rgba(255,255,255,.04); padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,.06); }
    .metric strong { display:block; font-size:24px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--gold); font-weight:700; }
    .links { display:flex; flex-wrap:wrap; gap:10px; }
    .button { display:inline-block; padding:10px 13px; border-radius:8px; background:#2b2b22; border:1px solid rgba(216,179,63,.45); color:var(--text); font-weight:700; }
    .button.primary { background:var(--gold); color:#14110a; }
    pre { white-space:pre-wrap; word-wrap:break-word; background:#0d0f14; border:1px solid var(--line); padding:18px; border-radius:10px; overflow:auto; }
    @media (max-width: 820px) { .span-8,.span-6,.span-4 { grid-column:span 12; } .metrics { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main>
    {{content}}
  </main>
</body>
</html>
